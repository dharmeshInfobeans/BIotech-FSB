        <!-- Desktop view -->
        <template if:true={isDesktop}>
            <div
                style="margin-top: 0.5rem; min-height: 10rem; max-height: 13rem; overflow-y: auto;padding-left: 1rem;padding-right: 1rem;">
                <template if:true={gridData}>
                    <lightning-tree-grid key-field="Id" columns={columns} data={gridData} hide-checkbox-column
                        hide-row-number-column>
                    </lightning-tree-grid>
                </template>
                <template if:false={gridData}>
                    <p style="text-align: center;margin-top: 4rem;font-weight: 600;" class="slds-p-around_medium">No
                        data
                        found</p>
                </template>
            </div>
        </template>

        <!-- Mobile view -->

        <template if:true={isMobile}>
            <div
                style="margin-top: 0.5rem; min-height: 10rem; max-height: 13rem; overflow-y: auto; padding-left: 1rem; padding-right: 1rem;">

                <template if:true={gridData}>
                    <div style="overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%;">

                        <div style="min-width: 75rem;">
                            <lightning-tree-grid key-field="Id" columns={columns} data={gridData} hide-checkbox-column
                                hide-row-number-column>
                            </lightning-tree-grid>
                        </div>
                    </div>
                </template>

                <template if:false={gridData}>

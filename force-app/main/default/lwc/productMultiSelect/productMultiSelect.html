<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label">{label}</label>
        <div class="slds-form-element__control">
            <!-- Combobox trigger -->
            <div class={comboboxClass} aria-expanded={isOpen} aria-haspopup="listbox" role="combobox">
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                    <input
                        type="text"
                        readonly
                        class="slds-input slds-combobox__input"
                        value={displayText}
                        onclick={handleToggle} />
                    <span class="slds-icon_container slds-input__icon slds-input__icon_right" onclick={handleToggle}>
                        <lightning-icon icon-name="utility:down" size="x-small" alternative-text="Open"></lightning-icon>
                    </span>
                </div>

                <!-- Dropdown options -->
                <template lwc:if={isOpen}>
                    <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template for:each={processedOptions} for:item="opt">
                                <li key={opt.value}
                                    role="presentation"
                                    class="slds-listbox__item"
                                    onclick={handleOptionSelect}
                                    data-value={opt.value}>
                                    <span class={opt.optionClass} role="option" aria-selected={opt.selected}>
                                        <span class="slds-media__figure slds-listbox__option-icon">
                                            <template lwc:if={opt.selected}>
                                                <lightning-icon icon-name="utility:check" size="x-small" alternative-text="Selected"></lightning-icon>
                                            </template>
                                        </span>
                                        <span class="slds-media__body">
                                            <span class="slds-truncate">{opt.label}</span>
                                        </span>
                                    </span>
                                </li>
                            </template>
                            <template lwc:if={isEmpty}>
                                <li class="slds-listbox__item">
                                    <span class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small">
                                        <span class="slds-media__body">
                                            <span class="slds-truncate slds-text-color_weak">No options available</span>
                                        </span>
                                    </span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>

            <!-- Selected chips -->
            <template lwc:if={hasSelected}>
                <div class="chips-container slds-var-m-top_x-small">
                    <template for:each={selectedOptions} for:item="sel">
                        <span key={sel.value} class="slds-badge chip-badge">
                            <span class="chip-label">{sel.label}</span>
                            <button class="chip-remove" onclick={handleRemove} data-value={sel.value} title="Remove">&#x2715;</button>
                        </span>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>

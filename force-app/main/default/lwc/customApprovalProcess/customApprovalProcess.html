        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </template>
    <div class="card">

        <div class="top-btn-container">
            <template if:true={hasFiles}>
                <lightning-button label="Preview Files" variant="brand" onclick={handlePreviewFiles}>
                </lightning-button>
            </template>
            <div if:false={hasFiles}> </div>

                <button class="custom-upload-btn" onclick={triggerFileInput} disabled={isLoading}> Upload Files </button>
                <input style = "display:none;" type="file" disabled={isLoading} lwc:ref="fileInput" class="hidden-file-input" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" onchange={handleFileChange}/>
            </template>
           
           
             <template if:true={adminFileExists}>
                <lightning-button label="Preview Admin File" variant="brand" onclick={handleCmdFileView}>
                </lightning-button>
            </template>

            <template if:true={isCountryAdmin}>
                <div class="file-row">
                    <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                    <span class="file-name">{cmdFileName}</span>
                    <lightning-button-icon icon-name="utility:preview" onclick={handleCmdFileView} variant="brand"
                        alternative-text="Preview file" title="Preview file">
                    </lightning-button-icon>
                    
                    <lightning-button-icon icon-name="utility:delete" onclick={handleDeleteCmdFile}
                        variant="destructive-text" alternative-text="Delete file" title="Delete file">
                    </lightning-button-icon>
                    
                </div>
            </template> -->

            <template if:true={isCountryAdmin}>

                <template if:false={adminFileExists}>
                    <button class="custom-upload-btn"
                onclick={triggerFileInput}
                disabled={isLoading}>
            {labels.Upload_Files__c}
        </button>

                    <input style="display:none;"
               type="file"
               disabled={isLoading}
               lwc:ref="fileInput"
               class="hidden-file-input"
               accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"
               onchange={handleFileChange}/>
                </template>
                <a class="hidden-link" href={filePreviewLink} target="_blank" style="display:none"></a>
                <!-- <a href=  target="_blank"></a> -->


                <template if:true={adminFileExists}>
                    <div class="file-row">
                        <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>

                        <!-- <span class="file-name">{cmdFileName}</span> -->
                        <span class="file-name">{displayFileName}</span>

                        <lightning-button-icon icon-name="utility:preview" onclick={handleCmdFileView} variant="brand"
                            alternative-text={labels.Preview_File__c}>
                        </lightning-button-icon>

                        <lightning-button-icon icon-name="utility:delete" onclick={handleDeleteCmdFile}
                            variant="destructive-text" alternative-text="Delete file">
                        </lightning-button-icon>
                    </div>
                </template>

            </template>


            <template if:false={isCountryAdmin}>

                <template if:true={adminFileExists}>
                    <lightning-button label="Preview Admin File" variant="brand" onclick={handleCmdFileView}>
                    </lightning-button>
                </template>

            </template>
        </div>



        <h1 class="title">{labels.Sample_Approval_Request__c}</h1>
        <div class="scrollable-content">   
        <div class="record-form">

            <lightning-record-view-form record-id={recordId} object-api-name="Sample_Request_Header__c">

                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <label style="font-weight: 600;color: black;">{labels.Customer__c}</label>
                        <lightning-output-field field-name="Customer__c" variant="label-hidden">
                        </lightning-output-field>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 Header_class">
                        <label style="font-weight: 600;color: black;">{labels.Sample_Request_Header_Name__c}</label>
                        <lightning-output-field class="Header_class" field-name="Name" variant="label-hidden">
                        </lightning-output-field>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 custom-margin">
                        <label style="font-weight: 600;color: black;">{labels.Opportunity__c}</label>
                        <lightning-output-field field-name="Opportunity__c" variant="label-hidden">
                        </lightning-output-field>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 Header_class custom-margin">
                        <label style="font-weight: 600;color: black;">{labels.Date__c}</label>
                        <lightning-output-field class="" field-name="Date__c" variant="label-hidden">
                        </lightning-output-field>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="count-container">
                            <div class="count-label">{labels.Overdue_Feedback_Count_Salesperson__c}</div>
                            <div class="count-value">{approvedFeedbackCount}</div>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="count-container Header_class">
                            <div class="count-label">{labels.Overdue_Feedback_Count_Contact__c}</div>
                            <div class="count-value pending">{pendingLineItemCount}</div>
                        </div>
                    </div>
                </div>
            </lightning-record-view-form>



            <div style="height: 210px;">
                <lightning-datatable class="hide_Column" key-field="Id" data={data} columns={columns}
                    errors={dataErrors} show-row-number-column suppress-bottom-bar hide-checkbox-column
                    onrowaction={handleRowAction} draft-values={draftValues} onsave={handleDraftSave}
                    oncellchange={handleCellChange}>
                </lightning-datatable>
            </div>
        </div>
        </div>
        <template lwc:if={isCurrentUserApprover}>
            <div class="button">
                <div class="show-in-mobile">
                    <lightning-button variant="neutral" label={labels.Close__c} onclick={handleClose}>
                    </lightning-button>
                </div>
                <lightning-button variant="success" label={labels.Approve__c} title="Successful action" data-action="approve" onclick={handleClick}
                    disabled={isProcessing} class="slds-m-center_x-small"></lightning-button>
                <lightning-button variant="destructive" label={labels.Reject__c} title="Destructive action" data-action="reject" onclick={handleClick}
                    disabled={isProcessing} class="slds-m-center_x-small"></lightning-button>
            </div>
        </template>
        <template lwc:else>
            <div class="show-in-mobile" style="margin-top: 1rem; text-align: end;">
                <lightning-button variant="neutral" label={labels.Close__c} onclick={handleClose}>
                </lightning-button>
            </div>
        </template>

    </div>

    <template if:true={showCommentsModal}>

        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container  custom-modal ">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
        title={labels.Close__c} onclick={closeModal}>
        <lightning-icon icon-name="utility:close" alternative-text={labels.Close__c} size="small"></lightning-icon>
        <span class="slds-assistive-text">{labels.Close__c}</span>
    </button>

                    <h2 class="slds-text-heading_large">{labels.Comments__c}</h2>
                </header>


                <div class="slds-modal__content slds-p-around_large">
                    <div class="main-header-second-screen" style="height:20rem">
                        <div class="slds-m-bottom_medium">
                            <strong>{labels.Total_Approved_Quantity_Till_Date__c}:</strong> {selectedQuantity}
                        </div>

                        <!-- <template if:true={showNewComment}>
                        <lightning-textarea label="Approver Comments" value={gsmComment} onchange={handleCommentChange}
                            rows="6">
                        </lightning-textarea>
                    </template> -->

                        <template if:true={showExistingComments}>

                            <div class="modal-datatable-wrapper" style="height: 16.5rem">
                                <lightning-datatable class="modal-datatable-scope" key-field="Id" data={commentsData}
                                    columns={commentColumns} hide-checkbox-column>
                                </lightning-datatable>
                            </div>

                        </template>
                    </div>

                </div>

                <!-- <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={saveComments}></lightning-button>
                </footer> -->

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open custom-backdrop"></div>

    </template>

</template>

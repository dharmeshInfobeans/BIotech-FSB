            <div class="slds-form-element">
                    <div class="slds-form-element__control">
                            <input type="text" 
                            placeholder="Search"
                                                class="searchInput"
                                                onkeyup={handleKeyChange} ></input>
                                            
                    </div>
                </div> 
            <lightning-layout multiple-rows="true" vertical-align="end" class="slds-scrollable_y">
                            <template for:each={events} for:item="event">
                                <lightning-layout-item key={event.Id} size="12" small-device-size="6" medium-device-size="4" large-device-size="3" padding="around-small" class="layoutItem" style="border-bottom: 1px solid gray;">
                                      <c-search-event-tile event={event}></c-search-event-tile>  
                                </lightning-layout-item>
                            </template>
                    </lightning-layout>

  <template if:true={addBdrMpdal}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
      aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h1 class="leadheader"><b>Lead Name-{accountname}</b></h1>
          <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                  <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                </svg>
                <span class="slds-assistive-text" onclick={closeModal}>Close</span>
              </button>
        </header>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"
          style="height: -webkit-fill-available;">
          <div style="width:100%;height: -webkit-fill-available;overflow:auto;">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered "
              style="width:100%;max-height:60px;overflow:auto;">
              <tr>
                <th>
                  <p><b>Product Name</b></p>
                </th>
                <th>
                  <p><b>Planned Stage</b></p>
                </th>
                <th>

                  <p><b>Planned Date</b></p>
                </th>
                <th>

                  <p><b>Completed Stage</b></p>
                </th>
                <th>

                  <p><b>Actual Date</b></p>
                </th>

              </tr>
              <tbody>
                <template for:each={leadData} for:item="item">
                  <tr key={item.key}>
                    <td class="slds-cell-wrap">
                      {item.ProductName}
                    </td>
                    <td>
                      {item.Stage}
                    </td>
                    <td>
                      {item.PlannedDate}
                    </td>
                    <td>
                      {item.Stage}
                    </td>
                    <td>
                      {item.ActualDate}
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" onclick={closeModal}>{labels.Cancel_Button__c}</button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

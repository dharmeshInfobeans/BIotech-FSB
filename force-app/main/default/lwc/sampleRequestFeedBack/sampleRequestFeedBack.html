<template>

    <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_medium">
        <!-- <div class="slds-modal__container"> -->
        <template lwc:if={showModal}>
            <div class="modal-overlay"></div>
        </template>
        <div class={parentModalClass}>


            <button class="slds-button slds-button_icon slds-modal__close" onclick={handleClose}>
                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
            </button>

            <div class="slds-modal__header">
                <h2 class="slds-text-heading_medium slds-text-align_center">
                    {labels.Add_Feedback__c}
                </h2>
            </div>

            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={isLoading}>
                    <div class="spinner-container">
                        <lightning-spinner alternative-text={labels.Loading__c} size="medium"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <template if:false={noRecords}>
                        <div class="table-wrapper">
                            <lightning-datatable key-field="id" data={records} columns={columns}
                                onrowaction={handleRowAction} hide-checkbox-column>
                            </lightning-datatable>
                        </div>

                        <div class=" slds-align_absolute-center">
                            <lightning-button variant="neutral" label={labels.Close__c} onclick={handleClose}>
                            </lightning-button>
                        </div>
                    </template>
                    <template if:true={noRecords}>
                        <div class="no-records-message">
                            <lightning-icon icon-name="utility:info" size="small" class="slds-m-bottom_x-small">
                            </lightning-icon>
                            <p>{labels.No_Sample_Requests_Executed__c}</p>
                        </div>
                    </template>
                </template>


            </div>



        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>



    <template lwc:if={showModal}>

        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <button class="slds-button slds-button_icon slds-modal__close" onclick={handleCloseChild}>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                </button>

                <div class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        {labels.Sample_Feedback__c}
                    </h2>
                </div>

                <div class="slds-modal__content slds-p-around_medium">

                    <c-sample-request-feedback-upload record-id={selectedRecordId} onclose={handleCloseChild}>
                    </c-sample-request-feedback-upload>

                </div>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>

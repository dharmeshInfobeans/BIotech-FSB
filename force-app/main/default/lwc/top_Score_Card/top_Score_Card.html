<template>
     <div class="full-wrapper">
    <div class="scorecard-container">
        <!-- Header Section -->
        <!-- <div class="header-section">
            <div class="logo-section">
                <img src={logoUrl} alt="Biotech Logo" class="logo-image" />
                
            </div>
            <div class="header-title-section">
                <h1 class="header-title">Top Score Card of an International Distributor</h1>
            </div>
        </div> -->

        <!-- Thank You Message (shown immediately after successful submission) -->
        <template if:true={showThankYou}>
            <div class="already-submitted-container">
                <div class="already-submitted-content">
                    <div class="already-submitted-icon">
                        <lightning-icon icon-name="utility:success" alternative-text="Submitted" size="large" class="success-icon"></lightning-icon>
                    </div>
                    <h2 class="already-submitted-title">Thank You!</h2>
                    <p class="already-submitted-message">
                        Your scorecard form has been submitted successfully. Our team will review your submission and contact you soon if needed.
                    </p>
                <template if:true={recordId}>
                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button label="Close Window" variant="neutral" onclick={handleCloseModal}></lightning-button>
                </div>
                </template>
                    <div class="already-submitted-info">
                        <lightning-icon icon-name="utility:info" size="small" class="info-icon"></lightning-icon>
                        <span>Thank you for taking the time to complete the evaluation form.</span>
                    </div>
                </div>
            </div>
        </template>

        <!-- Already Submitted Message (shown when status is Submitted on page load) -->
        <template if:true={showAlreadySubmitted}>
            <div class="already-submitted-container">
                <div class="already-submitted-content">
                    <div class="already-submitted-icon">
                        <lightning-icon icon-name="utility:success" alternative-text="Submitted" size="large" class="success-icon"></lightning-icon>
                    </div>
                    <h2 class="already-submitted-title">Form Already Submitted</h2>
                    <p class="already-submitted-message">
                        You have already submitted the scorecard form. Our team is currently reviewing your submission and will contact you soon if needed.
                    </p>
                    <div class="already-submitted-info">
                        <lightning-icon icon-name="utility:info" size="small" class="info-icon"></lightning-icon>
                        <span>If you need to make changes or have questions, please contact our support team.</span>
                    </div>
                </div>
            </div>
        </template>

        <!-- Account Information and Form Layout -->
        <template if:true={showForm}>
        <div class="main-content-layout">
            <!-- Account Information Sidebar -->
            <div class="account-info-sidebar">
                <div class="account-info-card">
                    <div class="account-info-header">
                        <lightning-icon icon-name="utility:user" size="small" class="account-icon"></lightning-icon>
                        <h3 class="account-info-title">Account Information</h3>
                    </div>
                    <div class="account-info-body">
                        <div class="account-info-item">
                            <div class="info-item-label">
                                <lightning-icon icon-name="utility:account" size="xx-small" class="field-icon"></lightning-icon>
                                <span>Account Name</span>
                            </div>
                            <div class="info-item-value">{accountName}</div>
                        </div>
                        <template if:true={contactName}>
                            <div class="account-info-item">
                                <div class="info-item-label">
                                    <lightning-icon icon-name="utility:user" size="xx-small" class="field-icon"></lightning-icon>
                                    <span>Contact Name</span>
                                </div>
                                <div class="info-item-value">{contactName}</div>
                            </div>
                        </template>
                        <template if:true={contactEmail}>
                            <div class="account-info-item">
                                <div class="info-item-label">
                                    <lightning-icon icon-name="utility:email" size="xx-small" class="field-icon"></lightning-icon>
                                    <span>Email</span>
                                </div>
                                <div class="info-item-value">{contactEmail}</div>
                            </div>
                        </template>
                        <template if:true={contactPhone}>
                            <div class="account-info-item">
                                <div class="info-item-label">
                                    <lightning-icon icon-name="utility:phone_portrait" size="xx-small" class="field-icon"></lightning-icon>
                                    <span>Phone</span>
                                </div>
                                <div class="info-item-value">{contactPhone}</div>
                            </div>
                        </template>
                        <template if:true={region}>
                            <div class="account-info-item">
                                <div class="info-item-label">
                                    <lightning-icon icon-name="utility:location" size="xx-small" class="field-icon"></lightning-icon>
                                    <span>Region</span>
                                </div>
                                <div class="info-item-value">{region}</div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Form Content Area -->
            <div class="form-content-area">
                <!-- Section Tabs -->
                <template if:true={sections.length}>
                    <div class="tabs-container">
                        <template for:each={sections} for:item="section" for:index="index">
                            <div 
                                key={section.sectionKey} 
                                class={section.tabClass}
                                data-section-key={section.sectionKey}
                                onclick={handleTabClick}>
                                <span class="tab-label">{section.sectionLabel}</span>
                            </div>
                        </template>
                    </div>

                    <!-- Section Content -->
                    <template if:true={selectedSection}>
                        <div class="section-content">
                    <h2 class="section-heading">{selectedSection.sectionLabel}</h2>

                    <!-- Validation Errors -->
                    <template if:true={validationErrors.length}>
                        <div class="validation-error-container">
                            <lightning-icon icon-name="utility:error" size="small" class="error-icon"></lightning-icon>
                            <span class="validation-error-message">Please answer the following mandatory questions:</span>
                            <ul class="validation-error-list">
                                <template for:each={validationErrors} for:item="error">
                                    <li key={error.questionKey} class="validation-error-item">
                                        <strong>{error.sectionLabel}:</strong> {error.questionText}
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>

                    <!-- Questions -->
                    <template if:true={selectedSection.questions}>
                        <template for:each={selectedSection.questions} for:item="question">
                            <template if:true={question.isActive}>
                                <div key={question.questionKey} class={question.questionClass}>
                                <div class="question-row">
                                    <label class={question.labelClass}>
                                        {question.questionText}
                                        <template if:true={question.isMandatory}>
                                            <span class="mandatory-indicator">*</span>
                                        </template>
                                    </label>
                                    
                                    <!-- Picklist (Radio Buttons) -->
                                    <template if:true={question.isPicklist}>
                                        <div class="options-container slds-m-left_xx-large">
                                            <template for:each={question.options} for:item="option">
                                                <div key={option.optionKey} class="radio-option-wrapper">
                                                    <label class="radio-option">
                                                        <input 
                                                            type="radio" 
                                                            name={question.questionKey}
                                                            value={option.optionKey}
                                                            data-question-key={question.questionKey}
                                                            data-option-key={option.optionKey}
                                                            data-score={option.score}
                                                            onchange={handleOptionChange}
                                                            checked={option.isSelected}>
                                                        <span class="radio-label">{option.Answer}</span>
                                                    </label>
                                                    
                                                    <!-- Conditional Text Input inline with "Yes" option -->
                                                    <template if:true={question.showTextInput}>
                                                        <template if:true={option.isYesOption}>
                                                            <div class="inline-text-input">
                                                                <input 
                                                                    type="text" 
                                                                    class="text-input-field-inline"
                                                                    data-question-key={question.questionKey}
                                                                    value={question.textInputValue}
                                                                    onchange={handleTextInputChange}
                                                                    placeholder="How many?">
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Checkbox -->
                                    <template if:true={question.isCheckbox}>
                                        <div class="options-container slds-m-left_xx-large">
                                            <template for:each={question.options} for:item="option">
                                                <label key={option.optionKey} class="checkbox-option">
                                                    <input 
                                                        type="checkbox" 
                                                        name={question.questionKey}
                                                        value={option.optionKey}
                                                        data-question-key={question.questionKey}
                                                        data-option-key={option.optionKey}
                                                        data-score={option.score}
                                                        onchange={handleCheckboxChange}
                                                        checked={option.isSelected}
                                                        disabled={isReadOnly}>
                                                    <span class="checkbox-label">{option.Answer}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            </template>
                        </template>
                    </template>

                    <!-- Navigation Buttons (only show when not read-only) -->
                    <template if:false={isReadOnly}>
                        <div class="button-container">
                            <!-- Previous Button (show on all pages except first) -->
                            <template if:false={isFirstSection}>
                                <button class="previous-button" onclick={handlePrevious}>
                                    Previous
                                </button>
                            </template>
                            
                            <!-- Next/Submit Button -->
                            <template if:true={isLastSection}>
                                <button class="submit-button" onclick={handleSubmit}>
                                    Submit
                                </button>
                            </template>
                            <template if:false={isLastSection}>
                                <button class="next-button" onclick={handleNext}>
                                    Save & Next
                                </button>
                            </template>
                        </div>
                    </template>
                    
                    <!-- Read-only message (show when form is read-only) -->
                    <template if:true={isReadOnly}>
                        <div class="read-only-message">
                            <lightning-icon icon-name="utility:lock" size="small" class="read-only-icon"></lightning-icon>
                            <span>This form is read-only. You cannot make changes to a submitted form.</span>
                        </div>
                    </template>
                        </div>
                    </template>
                </template>
            </div>
        </div>
        </template>

        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="loading-container">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <!-- Confirmation Modal -->
        <template if:true={showConfirmModal}>
            <div class="modal-overlay" onclick={handleCancelSubmit}>
                <div class="modal-container" onclick={handleModalClick}>
                    <div class="modal-header">
                        <h3 class="modal-title">Confirm Submission</h3>
                    </div>
                    <div class="modal-body">
                        <p class="modal-message">Are you sure you want to submit the scorecard? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="modal-cancel-button" onclick={handleCancelSubmit}>
                            Cancel
                        </button>
                        <button class="modal-submit-button" onclick={handleConfirmSubmit}>
                            Submit
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
    </div>
</template>

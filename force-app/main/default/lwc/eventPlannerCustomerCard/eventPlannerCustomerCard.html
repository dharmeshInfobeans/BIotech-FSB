<template>
    <!-- Customer Card -->
    <div
        data-cerating={account.CERating}
        data-cisrating={account.CISRating}
        data-existing={account.Existing}
        data-stage={account.leadstage}
        data-show={account.show}
        data-product={account.Product}
        onclick={handleCardClick}
        class="customer-card slds-box slds-var-p-around_medium slds-text-align_center slds-grid slds-grid_vertical slds-grid_align-center">

        <!-- Avatar Section -->
        <div class="slds-var-m-bottom_small">
            <div class="slds-grid slds-grid_align-center">
                <!-- Lead Icon -->
                <template if:true={isLead}>
                    <lightning-icon
                        icon-name="standard:lead"
                        alternative-text="Prospects"
                        size="large">
                    </lightning-icon>
                </template>
                <!-- Opportunity Icon -->
                <template if:true={isOpportunity}>
                    <lightning-icon
                        icon-name="standard:opportunity"
                        alternative-text="Opportunity"
                        size="large">
                    </lightning-icon>
                </template>
                <!-- Account Icon (default) -->
                <template if:false={isLeadOrOpportunity}>
                    <lightning-icon
                        icon-name="standard:account"
                        alternative-text="Account"
                        size="large">
                    </lightning-icon>
                </template>
            </div>
        </div>

        <!-- Name -->
        <div class="slds-var-m-bottom_small">
            <h3 class="slds-text-heading_small slds-truncate slds-text-align_center" title={displayTitle}>
                {displayTitle} 
            </h3>
        </div>

        <!-- Stage Row (Opportunities and Leads) -->
        <template if:true={account.Stage}>
            <div class="slds-var-m-bottom_small slds-text-align_center">
                <span class="card-label-text slds-text-color_weak slds-var-m-right_xx-small">Current Stage:</span>
                <lightning-badge label={account.Stage} variant="success" class="slds-badge_lightest"></lightning-badge>
            </div>
        </template>

        <!-- CE-CIS Rating -->
        <template if:true={account.CERating}>
            <div class="slds-var-m-bottom_small slds-text-align_center">
                <span class="card-label-text slds-text-color_weak slds-var-m-right_xx-small">CE-CIS Rating:</span>
                <lightning-badge label={account.CERating} variant="inverse" class="slds-badge_lightest"></lightning-badge>
            </div>
        </template>
        <template if:true={account.ProductFamily}>
            <div class="slds-var-m-bottom_small slds-text-align_center">
                <span class="card-label-text slds-text-color_weak slds-var-m-right_xx-small"><strong> ProductFamily :</strong> {account.ProductFamily}</span>
                <!-- <lightning-badge label={account.ProductFamily} variant="inverse" class="slds-badge_lightest"></lightning-badge> -->
            </div>
        </template>
        <!-- Contact Info -->
        <div class="contact-info-section">
            <template if:true={account.Phone}>
                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-var-m-bottom_xx-small">
                    <lightning-icon
                        icon-name="utility:phone_portrait"
                        size="x-small"
                        alternative-text="Phone"
                        class="slds-shrink-none slds-var-m-right_xx-small">
                    </lightning-icon>
                    <span style="text-transform: none;">
                        {account.Phone}
                    </span>
                </div>
            </template>
            <template if:true={hasLocation}>
                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                    <lightning-icon
                        icon-name="utility:location"
                        size="x-small"
                        alternative-text="Location"
                        class="slds-shrink-none slds-var-m-right_xx-small">
                    </lightning-icon>
                    <span class="slds-text-title_caps">
                        {locationDisplay}
                    </span>
                </div>
            </template>
        </div>
    </div>

    <!-- Ce-Cis Approval Confirmation Modal (SLDS Custom Modal) -->
    <template if:true={showCeCisConfirmationModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="ce-cis-modal-heading" aria-modal="true" aria-describedby="ce-cis-modal-content" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 id="ce-cis-modal-heading" class="slds-text-heading_medium slds-hyphenate">
                        {confirmationmessage.Confirmation__c}
                    </h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-var-p-around_medium" id="ce-cis-modal-content">
                    <div class="slds-text-align_center">
                        <p class="slds-var-m-bottom_small">{confirmationmessage.Ce_Cis_Approval_is_Pending_Do_You_Want_T__c}</p>
                        <p>{confirmationmessage.If_you_have_planned_Evaluation_or_Comme__c}</p>
                    </div>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <button
                        class="slds-button slds-button_neutral"
                        onclick={handleCeCisCancel}
                        aria-label={confirmationmessage.Cancel__c}>
                        {confirmationmessage.Cancel__c}
                    </button>
                    <button
                        class="slds-button slds-button_brand"
                        onclick={handleCeCisContinue}
                        aria-label={confirmationmessage.Continue__c}>
                        {confirmationmessage.Continue__c}
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

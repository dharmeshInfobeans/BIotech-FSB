<template>
    <!-- Loading Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <!-- Main Content -->
    <template if:false={isLoading}>
        <lightning-card title={cardTitle} icon-name="standard:record">
            <!-- Card Content -->
            <div class="slds-m-around_medium">

                <!-- Link Lead Button (Customer Visit only) -->
                <template if:true={isCustomerVisit}>
                    <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
                        <lightning-button variant="brand" label="Link Prospect" onclick={handleAddBdr}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </div>

                    <!-- CE and Phakic Rating Display -->
                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-form-element">
                                <label class="slds-form-element__label">CE Rating</label>
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{cerating}</span>
                                </div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-form-element">
                                <label class="slds-form-element__label">Phakic Rating</label>
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{cisrating}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Name Display (if pre-selected) -->
                    <template if:true={customerCheck}>
                        <div class="slds-box slds-m-bottom_small">
                            <h3 class="slds-text-heading_small"><strong>Contact Name: {contactname}</strong></h3>
                        </div>
                    </template>

                    <!-- Related To and Date in Two Columns -->
                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input type="text" value={accountname} label={labels.Related_to__c} disabled>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-form-element">
                                <label class="slds-form-element__label">{labels.Date__c}</label>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static date-display">{dateValueToShow}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Date Display (Read-only) - For non-customer visit events -->
                <template if:false={isCustomerVisit}>
                    <div class="slds-form-element slds-m-bottom_small">
                        <label class="slds-form-element__label">{labels.Date__c}</label>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static date-display">{dateValueToShow}</div>
                        </div>
                    </div>
                </template>

                <!-- Leave Event Form -->
                <template if:true={isLeave}>
                    <lightning-textarea name="notes" label={labels.notes__c} value={formData.notes}
                        onchange={handleFieldChange} required message-when-value-missing="Notes is required"
                        class="slds-m-bottom_small">
                    </lightning-textarea>

                    <lightning-combobox name="leaveType" label={labels.Leave__c} placeholder="Select leave type"
                        options={leaveOptions} value={formData.leaveType} onchange={handleFieldChange} required
                        message-when-value-missing="Leave type is required" class="slds-m-bottom_small">
                    </lightning-combobox>

                    <!-- Compensation Off Datatable (Inline) -->
                    <template if:true={showCompensationOffTable}>
                        <div class="slds-m-top_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Select Compensation Off Date</h3>

                            <!-- Show datatable only if there are dates -->
                            <template if:true={hasHolidayDates}>
                                <lightning-datatable key-field="Id" data={holidayList} columns={holidayColumns}
                                    onrowselection={handleRowSelection} selected-rows={selectedHolidayRows}
                                    max-row-selection="1">
                                </lightning-datatable>
                            </template>

                            <!-- Show message if no dates available -->
                            <template if:false={hasHolidayDates}>
                                <div class="slds-box slds-text-align_center slds-m-top_small">
                                    <p class="slds-text-color_weak">No compensation off dates available.</p>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>

                <!-- Holiday Event Form -->
                <template if:true={isHoliday}>
                    <lightning-textarea name="notes" label={labels.notes__c} value={formData.notes}
                        onchange={handleFieldChange} required message-when-value-missing="Notes is required"
                        class="slds-m-bottom_small">
                    </lightning-textarea>
                </template>

                <!-- Out of Office Event Form -->
                <template if:true={isOutOfOffice}>
                    <lightning-textarea name="notes" label={labels.notes__c} value={formData.notes}
                        onchange={handleFieldChange} required message-when-value-missing="Notes is required"
                        class="slds-m-bottom_small">
                    </lightning-textarea>

                    <lightning-combobox name="reviewCallType" label={labels.Call_Type__c}
                        placeholder="Select review call type" options={reviewCallOptions}
                        value={formData.reviewCallType} onchange={handleFieldChange} required
                        message-when-value-missing="Review call type is required" class="slds-m-bottom_small">
                    </lightning-combobox>
                </template>

                <!-- Customer Visit Event Form -->
                <template if:true={isCustomerVisit}>
                    <!-- Two Column Grid Layout -->
                    <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
                        <!-- Left Column -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input type="text" name="subject" label={labels.Subject__c}
                                value={formData.subject} onchange={handleFieldChange} required
                                message-when-value-missing="Subject is required" class="slds-m-bottom_small">
                            </lightning-input>
                        </div>

                        <!-- Right Column -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox name="meetingType" label={labels.Meeting_Type__c}
                                placeholder={labels.please_select__c} options={meetingTypeOptions}
                                value={formData.meetingType} onchange={handleFieldChange} required
                                message-when-value-missing="Meeting type is required" class="slds-m-bottom_small">
                            </lightning-combobox>
                        </div>

                        <!-- Left Column -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox name="callType" label={labels.Call_Type__c}
                                placeholder={labels.please_select__c} options={callTypeOptions}
                                value={formData.callType} onchange={handleFieldChange} disabled={callTypeDisable}
                                required message-when-value-missing="Call type is required" class="slds-m-bottom_small">
                            </lightning-combobox>
                        </div>
                        <template if:true={showTarget}>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                           
                            <lightning-record-picker label="Target" placeholder="Search Target..."
                                object-api-name="Target__c" filter={targetFilter} onchange={handleTargetChange}>
                            </lightning-record-picker>
                        </div>
                        </template>

                        <!-- Right Column - Sub Call Type (In Clinic Branding) OR Level Type (Phakic Training) OR Empty Spacer -->
                        <template if:true={isInClinicBranding}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-combobox name="subCallType" label="Sub Call Type"
                                    placeholder={labels.please_select__c} options={subCallTypeOptions}
                                    value={formData.subCallType} onchange={handleFieldChange} required
                                    message-when-value-missing="Sub Call type is required" class="slds-m-bottom_small">
                                </lightning-combobox>
                            </div>
                        </template>
                        <template if:false={isInClinicBranding}>
                            <template if:true={isPhakicTraining}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-combobox name="levelType" label="Level Type"
                                        placeholder={labels.please_select__c} options={levelTypeOptions}
                                        value={formData.levelType} onchange={handleFieldChange} required
                                        message-when-value-missing="Level type is required for Phakic Training"
                                        class="slds-m-bottom_small">
                                    </lightning-combobox>
                                </div>
                            </template>
                            <template if:false={isPhakicTraining}>
                                <!-- <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"></div> -->
                            </template>
                        </template>

                        <!-- Left Column - Contact -->
                        <template if:true={shouldShowContactField}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-combobox name="contact" label={labels.Contact__c}
                                    placeholder={labels.please_select__c} options={contactoption}
                                    value={formData.contact} onchange={handleFieldChange} class="slds-m-bottom_small">
                                </lightning-combobox>
                            </div>
                        </template>
                        <!-- <template if:false={shouldShowContactField}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"></div>
                        </template> -->

                        <!-- Right Column - spacer (product picklist hidden; value auto-filled from lead) -->


                        <!-- Left Column - Product Family (Read-only) -->
                        <template lwc:if={isAccountSelected}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-combobox name="eventProductFamily" label="Product Family"
                                    placeholder="Select  Product Family" options={eventProductFamily}
                                    value={formData.eventProductFamily} onchange={handleFieldChange} required
                                    message-when-value-missing="Review call type is required"
                                    class="slds-m-bottom_small">
                                </lightning-combobox>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="slds-form-element slds-m-bottom_small">
                                    <label class="slds-form-element__label">Product Family</label>
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{productfamily}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column - Product Group (Read-only) -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="slds-form-element slds-m-bottom_small">
                                    <label class="slds-form-element__label">Product Group</label>
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{productgroup}</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <!-- Full Width - Event Address -->
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-combobox name="Address" label="Event Address" placeholder={addressData}
                                options={addressList} value={currentAddress} onchange={handleFieldChange}
                                class="slds-m-bottom_small">
                            </lightning-combobox>
                        </div>

                        <!-- Left Column - Joint Assignee Toggle -->
                        <template if:false={isInClinicBranding}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="toggle-wrapper">
                                    <lightning-input type="toggle" name="jointAssignee" label={labels.joint_assignee__c}
                                        checked={formData.jointAssignee} onchange={handleFieldChange}
                                        message-toggle-active="Yes" message-toggle-inactive="No"
                                        class="slds-m-bottom_small">
                                    </lightning-input>
                                </div>
                            </div>
                        </template>
                        <!-- Empty spacer in right column when toggle is on left -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"></div>

                        <!-- Left Column - User Multi-Select (Conditional, appears below toggle) -->
                        <template if:true={showJointAssignee}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <c-multi-select-user-picklist-with-search multi-select="true"
                                    onselectuser={handleSelectUser} label={labels.user__c} labels={labels}
                                    class="slds-m-bottom_small">
                                </c-multi-select-user-picklist-with-search>
                            </div>
                        </template>

                        <!-- Full Width - Notes -->
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-textarea name="notes" label={labels.notes__c} value={formData.notes}
                                onchange={handleFieldChange} class="slds-m-bottom_small">
                            </lightning-textarea>
                        </div>
                    </div>
                </template>

            </div>

            <!-- Footer with Action Buttons -->
            <div slot="footer">
                <lightning-button variant="neutral" label={labels.Cancel_Button__c} onclick={handleCancel}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button variant="brand" label={labels.save__c} onclick={handleSave}
                    disabled={saveButtonDisabled}>
                </lightning-button>
            </div>
        </lightning-card>

        <!-- BD Plan Linking Modal (Keep as-is from old component) -->
        <template if:true={showBdPlanModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading" aria-modal="true"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h1 id="modal-heading" class="slds-modal__title slds-text-heading_medium">
                            Prospect Name - {accountname}
                        </h1>
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse"
                            onclick={closeModal} class="slds-modal__close">
                        </lightning-button-icon>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <!-- BD Plan Table (kept as HTML table as per user requirement) -->
                        <div style="width:100%;height:400px;overflow:auto;">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <th scope="col">
                                            <div class="slds-truncate">Select</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Product Name</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Planned Stage</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Planned Date</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Completed Stage</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Actual Date</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={bdplanlist} for:item="item">
                                        <tr key={item.Id}>
                                            <td>
                                                <lightning-input type="checkbox" checked={item.isCheck}
                                                    data-id={item.Id} onclick={handleClickCheckbox}>
                                                </lightning-input>
                                            </td>
                                            <td class="slds-cell-wrap">
                                                {item.ProductName}
                                            </td>
                                            <td>{item.Stage}</td>
                                            <td>{item.PlannedDate}</td>
                                            <td>{item.Stage}</td>
                                            <td>{item.ActualDate}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label={labels.Cancel_Button__c} onclick={closeModal}>
                        </lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleSaveUpdateBDPlan}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </template>
</template>

<template>
    <div class="language-wrapper">
        <template if:true={ready}>
            <div class={selectorClass}>
                <button class="lang-trigger" onclick={toggleDropdown} type="button">
                    <svg class="lang-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" 
                         fill="none" stroke="currentColor" stroke-width="2" 
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>

                    <span class="lang-label">{selectedLabel}</span>

                    <svg class="lang-caret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" 
                         fill="none" stroke="currentColor" stroke-width="2.5" 
                         stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <template if:true={isOpen}>
                    <div class="lang-menu">
                        <template for:each={languageOptions} for:item="opt">
                            <button key={opt.value}
                                    class={opt.itemClass}
                                    data-value={opt.value}
                                    onclick={handleSelect}
                                    type="button">
                                <span class="lang-menu-label">{opt.label}</span>
                                <template if:true={opt.isSelected}>
                                    <svg class="lang-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" 
                                         fill="none" stroke="currentColor" stroke-width="3" 
                                         stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </template>
                            </button>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>

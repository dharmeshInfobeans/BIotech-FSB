<template>
    <div class="card">
                <!-- <h2 class="title">Initial Stock Setup</h2> -->
                <h2 class="title">{label.Initial_Stock_Setup}{contactId}</h2>
                <template if:true={isLoading}>
                    <div class="slds-p-around_medium slds-align_absolute-center">
                        <lightning-spinner alternative-text="Loading products" size="medium"></lightning-spinner>
                    </div>
                </template>

                <template if:true={hasError}>
                    <div class="slds-text-color_error slds-p-around_small">
                        {errorMessage}
                    </div>
                </template>

        <template if:false={isLoading}>
            <template if:true={pagedProducts}>
                <div class="table">
                    <div class="table-header">
                        <!-- <span>Product Name</span>
                        <span>Initial Stock</span>
                        <span>Units</span> -->
                        <span>{label.Product_Name_Secondary_sales}</span>
                        <span>{label.Initial_Stock}</span>
                        <span>{label.Units}</span>
                    </div>

                    <template for:each={pagedProducts} for:item="product">
                        <div class="table-row" key={product.id}>
                            <span class="product-name">
                                {product.name}
                            </span>

                            <lightning-input type="number" value={product.stock} data-id={product.productId}
                                disabled={product.disableInput} onchange={handleStockChange}>
                            </lightning-input>

                            <!-- <span class="unit">Units</span> -->
                            <span class="unit">{label.Units}</span>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={pagedProducts.length}>
            </template>
            <template if:false={pagedProducts.length}>
                <!-- <div class="slds-p-around_medium slds-text-align_center">
                    No products available for this distributor.
                </div> -->
                <div class="slds-p-around_medium slds-text-align_center">
                    {label.No_products_available_for_this_distributor}
                </div>
            </template>
        </template>

        <template if:true={totalRecords}>
            <div class="pagination">
                <button onclick={handlePrev} disabled={isFirstPage}>
                    ‹
                </button>

                <span> {startRecord} – {endRecord} of {totalRecords}</span>
                <button onclick={handleNext} disabled={isLastPage}>
                    ›
                </button>
            </div>
        </template>

        <!-- <button class="save-btn" onclick={handleSave}>
            {label.Save_Initial_Stock}
        </button> -->

        <template if:true={hasEditAccess}>
            <button class="save-btn" onclick={handleSave}>
                {label.Save_Initial_Stock}
            </button>
        </template>
        <template if:false={hasEditAccess}>
            <div class="slds-text-color_weak">
                Read Only Access
            </div>
        </template>

    </div>
</template>

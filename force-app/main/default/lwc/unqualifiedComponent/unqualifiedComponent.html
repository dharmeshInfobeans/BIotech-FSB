<template>
	<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
		class="slds-modal slds-fade-in-open slds-modal_medium">
		<div class="slds-modal__container">
			<div class="slds-modal__header">
				<h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{labels.Mark_Unuqalified__c}</h1>
			</div>
			<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
				<div class="slds-grid slds-wrap">
					<div class="slds-col slds-size_6-of-12 ">
							<lightning-combobox name="Disqualified_Reason__c" label={labels.Unqualified_Reason__c} value={value}
							placeholder={labels.Unqualified_Reason__c} options={unqualifiedList} onchange={handleUnqualifiedLead} required="true" style="margin-right:20px;" disabled={disable}></lightning-combobox>
						
					</div>
					<div class="slds-col slds-size_6-of-12  ">
					<lightning-textarea  title="Unqualified Remarks" label={labels.Unqualfied_Remarks__c}
                        onchange={handleUnqualifiedLead} name="Unqualified_Remarks__c" disabled={disable} required="true">
						</lightning-textarea>
					</div>
				</div>
			</div>
			<div class="slds-modal__footer">
				<button class="slds-button slds-button_neutral" aria-label="Cancel and close" onclick={handleCancel} disabled={disable}>{labels.Back__c}</button>
				<button class="slds-button slds-button_brand" onclick={handleUpdateLead} disabled={disable}>{labels.Mark_lead_as_unqualified__c}</button>
			</div>
		</div>
	</section>
	<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
